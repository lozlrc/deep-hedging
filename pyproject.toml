[project]
name = "deep-hedging"
version = "0.1.0"
description = "Reproducing J.P. Morgan's Deep Hedging papers: pathwise deep hedging and risk-averse actor-critic hedging under transaction costs."
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "torch>=2.4",
    "matplotlib>=3.9",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dhedge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
